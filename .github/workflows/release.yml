name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Test
        run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npx playwright install --with-deps chromium firefox
      - name: Browser end-to-end tests
        run: npm run test:e2e
      - name: Build Linux amd64
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist/clipboard-exchange-linux-amd64
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/clipboard-exchange-linux-amd64/clipboard-exchange ./cmd/clipboard-exchange
          cp README.md THIRD_PARTY_NOTICES.md dist/clipboard-exchange-linux-amd64/
          tar -C dist -czf dist/clipboard-exchange-linux-amd64.tar.gz clipboard-exchange-linux-amd64
          cd dist && sha256sum clipboard-exchange-linux-amd64.tar.gz > checksums.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/clipboard-exchange-linux-amd64.tar.gz dist/checksums.txt --generate-notes --verify-tag
